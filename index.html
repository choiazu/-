#h1{left:79.0%;top:43.0%;width:10%;height:15%} /* 어린이 */

.counter{position:absolute;right:2.1%;top:1.6%;z-index:8;background:#e9f8ff;border:3px solid #4ca6d4;border-radius:22px;padding:.45em .85em;font-size:clamp(12px,1.5vw,23px);font-weight:900;box-shadow:0 4px 0 #377fa4}
.sound{position:absolute;right:2.2%;top:10%;z-index:8;border:3px solid #c98c4d;background:#fff8e8;border-radius:50%;width:clamp(42px,5vw,66px);aspect-ratio:1;cursor:pointer;font-weight:900}
#modal{position:fixed;inset:0;background:#16394db0;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.quiz{width:min(620px,95vw);background:#fff8e8;border:5px solid #bf8041;border-radius:28px;padding:25px;box-shadow:0 10px 0 #81552f;text-align:center}
.quiz h2{margin:0 0 8px;font-size:clamp(24px,4vw,34px)}
.quiz .q{font-size:clamp(18px,3vw,24px);font-weight:900;background:#ffe5a8;border:2px solid #eab442;border-radius:15px;padding:12px}
.answers{display:grid;gap:10px;margin:16px 0}
.ans{border:3px solid #70bce4;background:#e9f8ff;border-radius:17px;padding:13px;font-size:clamp(17px,2.6vw,21px);font-weight:900;cursor:pointer}
.ans:hover{background:#fff0b9;border-color:#e3a73a}
.feedback{min-height:56px;font-size:19px;font-weight:900;line-height:1.45;color:#d84f42}
.next{display:none;border:0;background:#f47d9a;color:white;border-radius:18px;padding:12px 25px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #b94f69}
#finish{position:fixed;inset:0;background:#16394db5;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.finishbox{background:#fff8e5;border:5px solid #c98b4c;border-radius:30px;padding:34px;text-align:center;max-width:560px;box-shadow:0 10px 0 #86572e}
.finishbox h2{font-size:36px;color:#e05a48;margin:6px} .stars{font-size:52px}
.restart{border:0;background:#4da9d6;color:white;border-radius:18px;padding:13px 24px;font-size:20px;font-weight:900;cursor:pointer}
@media(max-width:700px){.wrap{padding:0}.board{border-radius:0}.counter{top:1%;right:1%}.sound{top:10.5%;right:1%}}
</style>

<style id="all-text-black">
html, body, button, .counter, .quiz, .quiz h2, .quiz .q,
.ans, .feedback, .next, .finishbox, .finishbox h2, .restart {
  color:#000 !important;
}
</style>


<style id="deploy-cleanup">

.counter{
  position:absolute !important;
  right:2.1% !important;
  top:1.6% !important;
  z-index:15 !important;
  background:#e9f8ff !important;
  border:3px solid #4ca6d4 !important;
  border-radius:22px !important;
  padding:.45em .85em !important;
  width:auto !important;
  height:auto !important;
  margin:0 !important;
  overflow:visible !important;
  clip:auto !important;
  white-space:nowrap !important;
  font-size:clamp(12px,1.5vw,23px) !important;
  font-weight:900 !important;
  box-shadow:0 4px 0 #377fa4 !important;
}

/* 효과음 실제 버튼은 배경 UI와 겹치지 않는 위치 */
.sound{
  right:1.8% !important;
  top:11.5% !important;
  z-index:12 !important;
  background:#fff8e8ee !important;
  color:#000 !important;
}
/* 배포 시 클릭 영역이 보이지 않도록 유지 */
.hot{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
/* 태블릿/모바일 브라우저에서 게임판을 안정적으로 맞춤 */
body{overflow-x:hidden}
.board{max-height:100svh}
@media(max-width:700px){
  .sound{right:1.2%!important;top:11%!important}
}
</style>

</head>
<body>
<div class="wrap">
  <div class="board" aria-label="학교 앞 교통표지판 찾기 게임">
    <div class="counter" id="counter">찾은 표지판 0 / 6 ★</div>
    <button class="sound" id="sound" aria-label="효과음 켜기 또는 끄기">🔊</button>
    <button class="hot" id="h0" data-i="0" aria-label="횡단보도 표지판"></button>
    <button class="hot" id="h1" data-i="1" aria-label="어린이 보호 표지판"></button>
    <button class="hot" id="h2" data-i="2" aria-label="자전거 표지판"></button>
    <button class="hot" id="h3" data-i="3" aria-label="진입금지 표지판"></button>
    <button class="hot" id="h4" data-i="4" aria-label="주차금지 표지판"></button>
    <button class="hot" id="h5" data-i="5" aria-label="보행자 표지판"></button>
  </div>
</div>

<div id="modal">
 <div class="quiz">
   <h2 id="title">🔎 표지판을 발견했어요!</h2>
   <div class="q" id="question"></div>
   <div class="answers" id="answers"></div>
   <div class="feedback" id="feedback"></div>
   <button class="next" id="next">계속 찾기</button>
 </div>
</div>

<div id="finish">
 <div class="finishbox">
   <div class="stars">⭐ ⭐ ⭐</div>
   <h2>6개를 모두 찾았어요!</h2>
   <p><b>표지판은 색·모양·그림만 보아도 뜻을 빠르게 알 수 있어요.</b></p>
   <p>학교 앞에서는 표지판을 잘 살피고 안전 약속을 지켜요!</p>
   <button class="restart" onclick="location.reload()">다시 하기</button>
 </div>
</div>

<script>
const items=[
{name:"횡단보도",q:"횡단보도 바로 옆에 있어요. 무엇을 알려줄까요?",a:["사람이 길을 건너는 곳이에요.","자동차를 세우는 곳이에요.","자전거만 다니는 곳이에요."],ok:0,msg:"맞아요! 횡단보도가 있는 곳임을 알려줘요. 길을 건널 때는 좌우를 살펴요."},
{name:"어린이 보호",q:"학교 입구에 있어요. 왜 이 표지판이 필요할까요?",a:["어린이가 많이 다녀서 조심하라는 뜻이에요.","자동차가 빨리 달려도 된다는 뜻이에요.","여기에 주차해도 된다는 뜻이에요."],ok:0,msg:"맞아요! 학교 주변에는 어린이가 많으니 천천히, 조심해서 지나가야 해요."},
{name:"자전거",q:"오른쪽 통행 공간에 자전거 그림이 있어요. 무엇과 관계있을까요?",a:["자전거가 다니는 길이에요.","버스만 다니는 길이에요.","자동차를 세우는 곳이에요."],ok:0,msg:"맞아요! 자전거 그림을 보면 자전거와 관련된 길임을 쉽게 알 수 있어요."},
{name:"진입금지",q:"왼쪽 골목 입구에 있어요. 자동차는 어떻게 해야 할까요?",a:["이쪽으로 들어가면 안 돼요.","더 빨리 들어가야 해요.","아무 곳에나 세워도 돼요."],ok:0,msg:"맞아요! 이 방향으로 차량이 들어가면 안 된다는 뜻이에요."},
{name:"주차금지",q:"학교 앞 도로 가장자리에 있어요. 무엇을 하면 안 될까요?",a:["걷기","주차하기","횡단보도 건너기"],ok:1,msg:"맞아요! 이곳에는 자동차를 주차하면 안 돼요."},
{name:"보행자",q:"학교로 걸어가는 길 가까이에 있어요. 무엇과 관계있을까요?",a:["보행자가 다니는 길","자동차가 빨리 달리는 길","비행기가 다니는 길"],ok:0,msg:"맞아요! 사람 그림을 보면 보행자와 관련된 곳이라는 것을 알 수 있어요."}
];
let found=new Set(), current=-1, soundOn=true;
const modal=document.getElementById("modal"), feedback=document.getElementById("feedback"), next=document.getElementById("next");
function tone(freq,dur,type="sine"){if(!soundOn)return;const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.08,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.start();o.stop(A.currentTime+dur)}
function correctSound(){tone(660,.12);setTimeout(()=>tone(880,.18),110)}
function wrongSound(){tone(190,.2,"triangle")}
document.getElementById("sound").onclick=()=>{soundOn=!soundOn;document.getElementById("sound").textContent=soundOn?"🔊":"🔇"};
document.querySelectorAll(".hot").forEach(b=>b.onclick=()=>openQuiz(+b.dataset.i));
function openQuiz(i){
 current=i; const x=items[i]; modal.style.display="flex"; feedback.textContent=""; next.style.display="none";
 document.getElementById("question").textContent=x.q;
 const box=document.getElementById("answers"); box.innerHTML="";
 x.a.forEach((t,j)=>{const b=document.createElement("button");b.className="ans";b.textContent=(j+1)+". "+t;b.onclick=()=>answer(j,b);box.appendChild(b)})
}
function answer(j,b){
 const x=items[current];
 if(j===x.ok){
   correctSound(); feedback.textContent="⭐ "+x.msg;
   document.querySelectorAll(".ans").forEach(z=>z.disabled=true);
   found.add(current); document.getElementById("h"+current).classList.add("found");
   document.getElementById("counter").textContent=`찾은 표지판 ${found.size} / 6 ★`;
   next.style.display="inline-block";
 } else {wrongSound(); feedback.textContent="아쉬워요! 표지판의 색·모양·그림과 주변 장소를 다시 살펴보세요.";}
}
next.onclick=()=>{modal.style.display="none"; if(found.size===6)setTimeout(()=>document.getElementById("finish").style.display="flex",250)};
modal.onclick=e=>{if(e.target===modal)modal.style.display="none"};
</script>
</body>
</html>
